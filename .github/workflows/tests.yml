name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # OpenCV (opencv-python) needs these shared libs to import on headless CI.
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geometry]"

      - name: Lint (ruff)
        run: ruff check src tests
        continue-on-error: true      # advisory for now; flip to blocking when clean

      - name: Run tests with coverage
        run: pytest --cov=incoming_profile_utility
