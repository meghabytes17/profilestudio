[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incoming-profile-utility"
version = "1.0.0"
description = "Generate symmetric semiconductor cross-section profiles from CSV/parametric input and render them to .bmp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "opencv-python>=4.9",
    "customtkinter>=5.2",
    "pillow>=10.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
geometry = ["shapely>=2.0"]  # for parametric profile builders (docs/03)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
build = ["pyinstaller>=6.0"]      # the .exe toolchain; included in requirements-lock.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["incoming_profile_utility"]
omit = ["*/gui.py", "*/main.py"]   # GUI (Tk) and CLI stub are not unit-tested

[tool.coverage.report]
show_missing = true
skip_covered = true

[project.scripts]
# Lets users run `profile-utility` from the shell once installed.
profile-utility = "incoming_profile_utility.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
